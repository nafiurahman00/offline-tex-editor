name: release

# Publishes the wheel to PyPI when a version tag (v0.2.0, …) is pushed. Uses PyPI trusted publishing, so no token
# is stored here; CONTRIBUTING.md lists the publisher settings on pypi.org.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    # No GitHub environment, so "Environment name" stays empty in the trusted publisher on PyPI.
    # A job's permissions replace the workflow's, so list both: reading this repository, and the OpenID Connect
    # token PyPI's trusted publishing needs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import offline_tex_editor as m; print(m.__version__)')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .
      # Also uploads attestations, which let anyone check on PyPI that the wheel was built here.
      - uses: pypa/gh-action-pypi-publish@release/v1

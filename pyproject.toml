[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-tex-editor"
dynamic = ["version"]
description = "A LaTeX editor that runs on your own machine: browser editing, latexmk, PDF preview with two-way SyncTeX, find and replace, git. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KSMubasshir" }]
keywords = ["latex", "tex", "editor", "synctex", "latexmk", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://offline-tex-editor.github.io/"
Issues = "https://github.com/offline-tex-editor/offline-tex-editor.github.io/issues"

[project.scripts]
offline-tex-editor = "offline_tex_editor.server:main"

[tool.setuptools]
packages = ["offline_tex_editor"]

[tool.setuptools.dynamic]
version = { attr = "offline_tex_editor.__version__" }

[tool.setuptools.package-data]
offline_tex_editor = ["index.html", "static/*", "vendor/README.md", "vendor/**/*"]
